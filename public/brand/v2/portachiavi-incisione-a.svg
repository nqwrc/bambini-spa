<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="40mm" height="59mm" viewBox="0 0 40 59">
  <title>Bambini S.p.A. - portachiavi, Versione A (Linea), incisione</title>
  <desc>File di produzione, portachiavi Bambini S.p.A. Unità: 1 = 1 mm, pezzo 40 x 59 mm. Un solo colore: nero pieno = area da incidere al laser, oppure cavità da smaltare nel conio. Nessun testo: BAMBINI è convertito in tracciati (Montserrat ExtraBold 800, licenza OFL), i tratti del marchio sono espansi in contorni, tutto unito in un solo tracciato senza sovrapposizioni. Tratto più sottile 0,76 mm. Spazio più stretto tra elementi separati 1,16 mm; contropunzone più piccolo 0,662 mm; ceppo-mezzaluna 2,857 mm. Sotto 0,3 mm restano solo i vertici degli angoli concavi (M, N, A, vita delle B), lunghi al massimo 0,46 mm. Livelli: "incisione" = grafica; "foro" = foro portachiavi diametro 4 mm, da forare, non incidere; "sagoma" = contorno del pezzo, raggio 4 mm, solo riferimento, non incidere.</desc>
  <g id="sagoma" inkscape:groupmode="layer" inkscape:label="sagoma (riferimento, non incidere)" fill="none" stroke="#000" stroke-width="0.1">
    <path d="M4 0H36A4 4 0 0 1 40 4V55A4 4 0 0 1 36 59H4A4 4 0 0 1 0 55V4A4 4 0 0 1 4 0Z"/>
  </g>
